name: Update feed data

on:
  workflow_dispatch:
  schedule:
    # JST 07:10 - ship operation status after early-morning announcements.
    - cron: "10 22 * * *"
    # JST 10:00 - morning office check.
    - cron: "0 1 * * *"
    # JST 12:00 - midday check.
    - cron: "0 3 * * *"
    # JST 15:00 - afternoon business-hours check.
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-feed-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate files
        run: npm run validate

      - name: Fetch external updates
        run: npm run fetch

      - name: Commit updated data
        run: |
          if git diff --quiet -- data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update feed data"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "git push failed after ${attempt} attempts"
              exit 1
            fi

            sleep_seconds=$((attempt * 15))
            echo "git push failed; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
          done
